[project]
name = "vi-api"
version = "1.0.0"
requires-python = ">=3.14"

dependencies = [
    # 分析模块
    "vi-analysis",
    # 配置框架
    "vi-framework",
    # Web 框架
    "fastapi",
    # ASGI 服务器，含性能组件
    "uvicorn[standard]",
    # 异步 HTTP 客户端
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vi"]

[tool.uv.sources]
vi-framework = { workspace = true }
vi-analysis = { workspace = true }