[project]
name = "vi-common"
version = "1.0.0"
requires-python = ">=3.11,<3.13"

dependencies = [
    # 配置管理
    "pydantic-settings",
    # 表单和文件上传支持
    "python-multipart",
    # YAML 解析
    "pyyaml",
    # FFmpeg 封装
    "ffmpeg-python",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vi"]