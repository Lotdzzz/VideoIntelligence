[project]
name = "vi-analysis"
version = "1.0.0"
requires-python = ">=3.11,<3.13"

dependencies = [
    # 框架模块
    "vi-framework",
    # 视频下载模块
    "yt-dlp",
    # 视频解析依赖
    "opencv-python",
    "transformers",
    "torch",
    "pillow",
    "python-dotenv",
    "openai",
    "funasr",
    "IPython",
     "torchaudio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vi"]

[tool.uv.sources]
vi-framework = { workspace = true }