[project]
name = "vi-analysis"
version = "1.0.0"
requires-python = ">=3.14"

dependencies = [
    "vi-framework"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vi"]

[tool.uv.sources]
vi-framework = { workspace = true }