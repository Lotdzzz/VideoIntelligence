[project]
name = "vi-framework"
version = "1.0.0"
requires-python = ">=3.11,<3.13"

dependencies = [
    # 文件模块
    "vi-common",
    # MinIO 对象存储
    "minio",
    # RabbitMQ 客户端
    "pika",
    # Nacos 服务注册与配置
    "nacos-sdk-python",
]

[tool.uv.sources]
vi-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vi"]