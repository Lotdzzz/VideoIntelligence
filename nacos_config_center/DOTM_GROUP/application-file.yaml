spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB    # 整个请求最大大小，包含所有文件和表单字段
upload:
  white:
    list:
      - jpg
      - jpeg
      - png
    dir: /uploadDir
aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: riventoy-java-upload